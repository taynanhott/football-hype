packages:
  - apps/*
  - packages/*
# Keep starting scripts from replacing a working installation (including external stores).
# Dependency changes are installed explicitly with pnpm install.
verifyDepsBeforeRun: warn
allowBuilds:
  '@firebase/util': false
  esbuild: true
  workerd: true
  msgpackr-extract: false
  protobufjs: false
  re2: false

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20261029.1'
